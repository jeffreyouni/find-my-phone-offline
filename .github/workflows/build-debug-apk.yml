name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: vosk-models-en-us-0.15-cn-0.22

      - name: Download Vosk models
        run: ./scripts/fetch_models.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FindMyPhone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
